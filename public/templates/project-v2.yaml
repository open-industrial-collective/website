links:
  docs: https://example.org/docs
  wiki: https://example.org/wiki
  issues: https://example.org/issues
  discussions: https://example.org/community
  changelog: https://example.org/releases
  support: https://example.org/support

branding:
  logo:
    on_light: ./media/logo-on-light.png
    on_dark: ./media/logo-on-dark.png
    alt: Example Process Viewer
media:
  - id: process
    type: image
    src: ./media/overview.webp
    alt: Process diagram showing a tank, pump and heat exchanger with simulated readings.
    caption: Sample scene with synthetic data; no plant connection.
    credit: Example Tools Collective
  - id: setup
    type: image
    src: ./media/setup.webp
    alt: Setup screen with a local sample scene selected.
    caption: Choose a sample scene to begin.
  # A short GIF is also type: image. OIC creates an animated WebP and a still preview.
  # - id: quick-tour
  #   type: image
  #   src: ./media/quick-tour.gif
  #   alt: Cursor opening a sample process diagram and selecting a pump.
  #   title: One-minute workflow
  #   caption: Synthetic sample data; animation plays only when selected.
  - id: walkthrough
    type: video
    url: https://example.org/videos/walkthrough
    poster: ./media/walkthrough-poster.webp
    title: A short tour of the viewer
    transcript: https://example.org/videos/walkthrough-transcript

faq:
  - question: Does this connect to my plant?
    answer: No. This listed preview uses synthetic data only.
  - question: Do I need an account?
    answer: No. Open the browser preview to try the included scene.
lifecycle:
  stage: preview
  maintenance: active
release:
  version: "0.1.0"
  url: https://example.org/releases/0.1.0
  date: "2026-09-28"
visibility: listed
