license:
  name: Free browser preview terms
  url: https://dimension-engine-showcase.vercel.app/DEMO_TERMS.txt
access:
  edition: Browser preview
  cost: free
  notes: The hosted browser preview is free to use for evaluation and learning,
    with no account or time limit. It uses synthetic or reference data and has
    no Gateway save or plant connection. The complete local development showcase runs inside Perspective using the
    native Dimension Engine module. It requires Ignition Perspective trial time
    or a license. The unsigned module is built locally; no public installer is offered yet.
  account_required: false
requirements:
  - name: Modern desktop browser
    kind: software
    cost: free
    notes: The hosted preview uses synthetic or reference data. WebGPU features
      require a compatible browser and GPU.
  - name: Keyboard or gamepad
    kind: hardware
    cost: unknown
    notes: Required for the factory platformer. Touch controls are not included.
    applies_to:
      - play
  - name: Ignition Perspective
    kind: software
    cost: optional-paid
    notes: Only needed for the native local Ignition project. An unsigned Dimension
      Engine development module hosts the full showcase. WebDev is not required
      by this native project; the hosted browser preview needs neither module.
