faq:
  - question: Does the hosted preview connect to a plant?
    answer: No. The browser preview uses synthetic or reference data. No plant or
      Ignition Gateway is connected.
  - question: Can I download a native Ignition module?
    answer: A native module now builds and runs locally with the complete showcase
      in a Perspective project, including Super Maintenance Bros. It is still an
      unsigned development preview; a signed public installer is not offered yet.
  - question: What is Super Maintenance Bros.?
    answer: A 2D platformer in a procedural 3D factory. Cross conveyors, power the
      lift, dodge presses and restore the line. Try “Watch a shift” for a guided
      run, or use WASD, Space and E to play. Includes cinematic camera movement,
      GPU effects, quiet sound and a hideable FPS counter. “Behind the game”
      explains its rendering and state. The separate local Ignition edition
      connects to synthetic Gateway tags and a native Perspective dashboard.
lifecycle:
