name: Check registered project profiles
on:
  schedule:
    - cron: '37 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: profile-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run schema
      - run: npx tsx scripts/refresh-profiles.ts
        env:
          GH_TOKEN: ${{ github.token }}
