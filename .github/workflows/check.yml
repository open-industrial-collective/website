name: Validate website and profiles
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install mobile test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Check mobile experience in Chrome and WebKit
        run: |
          npm run preview -- --port 4173 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:4173/ > /dev/null
          node tests/mobile.mjs
          node tests/explore.mjs
  profile-check-action:
    # The publisher-side Action, run the way a listing repository would run it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: open-industrial-collective/dimension-engine-listing
          path: publisher
      - uses: ./profile-check
        with:
          directory: ${{ github.workspace }}/publisher
